<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>محاسبه پارامترهای شربت — کارخانه قند صنوبر</title>
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;
  --bg-start:#f0f4ff;--bg-end:#e0e7ff;
  --surface:#ffffff;--surface-2:#f8fafc;
  --border:#e2e8f0;--text:#0f172a;--text-soft:#475569;--muted:#94a3b8;
  --color:#ec4899;--turbidity:#06b6d4;--ash:#f59e0b;--so2:#10b981;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --shadow:0 4px 20px rgba(99,102,241,.08);
}
body.dark{
  --bg-start:#0a0f1e;--bg-end:#0f172a;
  --surface:#1e293b;--surface-2:#0f172a;
  --border:#334155;--text:#f1f5f9;--text-soft:#cbd5e1;--muted:#64748b;
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;font-family:Tahoma,'Segoe UI',sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg-start),var(--bg-end));color:var(--text);font-size:14px;line-height:1.6}

.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.topbar .tb-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--primary-dark);flex:1;justify-content:center}
.topbar .tb-title .icon{font-size:20px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);font-family:inherit;text-decoration:none;transition:all .15s;flex-shrink:0}
.icon-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.05)}
.icon-btn.back{font-size:22px;font-weight:900;line-height:1}

.section{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-title{font-size:12px;font-weight:900;color:var(--primary-dark);margin-bottom:10px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}

.compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compact-grid .full{grid-column:1/-1}
@media(max-width:500px){.compact-grid{grid-template-columns:1fr}}

.pill{position:relative;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:8px 12px 6px;transition:all .15s}
.pill:focus-within{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.pill.p-color:focus-within{border-color:var(--color);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
.pill.p-turbidity:focus-within{border-color:var(--turbidity);box-shadow:0 0 0 3px rgba(6,182,212,.12)}
.pill.p-ash:focus-within{border-color:var(--ash);box-shadow:0 0 0 3px rgba(245,158,11,.12)}
.pill.p-so2:focus-within{border-color:var(--so2);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.pill .pill-lbl{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;font-weight:900;color:var(--muted);margin-bottom:2px}
.pill .pill-lbl .u{font-size:9.5px;background:var(--surface);padding:1px 6px;border-radius:6px;color:var(--primary);border:1px solid var(--border);font-family:'Courier New',monospace}
.pill input{width:100%;border:none;background:transparent;outline:none;font-size:17px;font-weight:900;color:var(--text);font-family:'Courier New',monospace;direction:ltr;text-align:left;padding:0}
.pill input::placeholder{color:var(--muted);font-weight:normal;opacity:.6}

.info-line{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-style:italic;padding:6px 10px;margin-top:8px;background:var(--surface-2);border-radius:8px;border:1px dashed var(--border)}
.info-line .i{font-style:normal}

.btn-calc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px;margin-bottom:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:15px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(99,102,241,.35);transition:all .15s}
.btn-calc:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.45)}
.btn-calc:disabled{opacity:.5;cursor:not-allowed;transform:none}

.err-box{display:none;gap:8px;align-items:flex-start;background:rgba(239,68,68,.08);border:1.5px solid var(--danger);color:var(--danger);padding:10px 12px;border-radius:10px;font-size:12px;font-weight:bold;margin-bottom:14px;line-height:1.7}
.err-box.show{display:flex}

.results-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:520px){.results-grid.two-col{grid-template-columns:1fr 1fr}}

.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border);position:relative;overflow:hidden}
.res::before{content:'';position:absolute;inset:0;right:0;width:4px;background:var(--accent,var(--primary))}
.res .r-ico{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:var(--accent,var(--primary))}
.res .r-body{flex:1;min-width:0}
.res .r-lbl{font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.2px}
.res .r-val{font-size:19px;font-weight:900;color:var(--accent,var(--primary));line-height:1.1;direction:ltr;text-align:left;font-family:'Courier New',monospace}
.res .r-unit{font-size:11px;color:var(--muted);font-weight:bold;margin-right:3px}

.res.res-color{--accent:var(--color)}
.res.res-turbidity{--accent:var(--turbidity)}
.res.res-ash{--accent:var(--ash)}
.res.res-ashp{--accent:#d97706}
.res.res-so2{--accent:var(--so2)}

.empty-res{text-align:center;padding:24px 16px;color:var(--muted);font-size:12.5px;line-height:1.9}
.empty-res .em-icon{font-size:38px;opacity:.4;display:block;margin-bottom:8px}

.verify{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;border:1px dashed var(--border);font-size:10.5px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.verify .v{display:flex;justify-content:space-between;gap:6px}
.verify .v .k{color:var(--muted)}
.verify .v .val{font-family:'Courier New',monospace;font-weight:900;color:var(--text-soft);direction:ltr}

.density-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;margin-top:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11px;font-weight:900;color:var(--primary-dark);cursor:pointer;transition:all .15s}
.density-toggle:hover{background:rgba(99,102,241,.06)}
.density-toggle .arrow{transition:transform .2s;font-size:12px}
.density-toggle.open .arrow{transform:rotate(180deg)}

.density-wrap{max-height:0;overflow:hidden;transition:max-height .3s}
.density-wrap.open{max-height:280px;overflow-y:auto}
.density-wrap::-webkit-scrollbar{width:6px}
.density-wrap::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
.density-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.density-table thead th{position:sticky;top:0;z-index:1;background:var(--surface-2);color:var(--muted);padding:6px;font-size:10px;font-weight:900;border-bottom:1px solid var(--border);text-align:center}
.density-table td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--border);font-family:'Courier New',monospace;font-weight:bold;color:var(--text);transition:all .15s}
.density-table td:first-child{color:var(--primary-dark)}
.density-table tbody tr.active td{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(16,185,129,.05));color:#059669!important;font-weight:900}
.density-table tbody tr.active td:first-child{border-right:3px solid var(--success)}

.bottom-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:none;border-radius:12px;font-size:13.5px;font-weight:900;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-send{background:var(--success);color:#fff}
.btn-send:hover:not(:disabled){background:#059669;transform:translateY(-1px)}
.btn-send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-reset{background:var(--surface-2);color:var(--text-soft);border:1.5px solid var(--border)}
.btn-reset:hover{background:var(--border)}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;max-width:92vw}
.toast{background:var(--surface);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.2);border-right:4px solid var(--primary);pointer-events:auto;min-width:200px;max-width:92vw;display:flex;align-items:center;gap:8px;animation:tIn .3s ease-out}
.toast.success{border-right-color:var(--success)}
.toast.error{border-right-color:var(--danger)}
.toast.warning{border-right-color:var(--warning)}
@keyframes tIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes tOut{to{opacity:0;transform:translateY(20px)}}
.toast.out{animation:tOut .3s ease-in forwards}
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <button class="icon-btn" onclick="toggleDark()" id="darkBtn" title="حالت شب">🌙</button>
    <div class="tb-title"><span class="icon">🧪</span><span>محاسبه پارامترهای شربت</span></div>
    <button class="icon-btn back" onclick="goBack()" title="بازگشت">‹</button>
  </div>

  <div class="section">
    <div class="section-title"><span class="dot"></span> ورودی‌ها</div>
    <div class="compact-grid">

      <div class="pill">
        <div class="pill-lbl"><span>بریکس</span><span class="u">%</span></div>
        <input id="inBrix" type="text" inputmode="decimal" value="50" placeholder="50">
      </div>

      <div class="pill p-ash">
        <div class="pill-lbl"><span>هدایت الکتریکی</span><span class="u">μS/cm</span></div>
        <input id="inEC" type="text" inputmode="decimal" placeholder="22">
      </div>

      <div class="pill p-color">
        <div class="pill-lbl"><span>جذب بدون کدورت</span><span class="u">A₁</span></div>
        <input id="inA1" type="text" inputmode="decimal" placeholder="0.005">
      </div>

      <div class="pill p-turbidity">
        <div class="pill-lbl"><span>جذب با کدورت</span><span class="u">A₂</span></div>
        <input id="inA2" type="text" inputmode="decimal" placeholder="0.010">
      </div>

      <div class="pill p-so2">
        <div class="pill-lbl"><span>ید مصرفی</span><span class="u">cc</span></div>
        <input id="inV" type="text" inputmode="decimal" placeholder="3.5">
      </div>

      <div class="pill p-so2">
        <div class="pill-lbl"><span>وزن ماده خشک</span><span class="u">g</span></div>
        <input id="inW" type="text" inputmode="decimal" value="50" placeholder="50">
      </div>

    </div>

    <div class="info-line">
      <span class="i">ℹ️</span>
      <span>نرمالیته ید ثابت: ۱/۳۰۰</span>
    </div>

    <div class="density-toggle" onclick="toggleDensity()" id="densityToggle">
      <span>📋 جدول چگالی ساکارز (۲۰°C)</span>
      <span class="arrow">▼</span>
    </div>
    <div class="density-wrap" id="densityWrap">
      <table class="density-table">
        <thead><tr><th>Brix %</th><th>ρ (g/mL)</th></tr></thead>
        <tbody id="densityBody"></tbody>
      </table>
    </div>
  </div>

  <div class="err-box" id="errBox"><span>⚠️</span><span id="errMsg"></span></div>
  <button class="btn-calc" onclick="calculate()">🧮 محاسبه</button>

  <div class="section">
    <div class="section-title"><span class="dot"></span> نتایج محاسبه</div>
    <div id="resultsArea">
      <div class="empty-res">
        <span class="em-icon">🧪</span>
        مقادیر را وارد کرده و دکمه محاسبه را بزنید
      </div>
    </div>
  </div>

  <div class="bottom-actions">
    <button class="btn btn-send" id="sendBtn" onclick="sendToForm()" disabled>📤 ارسال به فرم شربت</button>
    <button class="btn btn-reset" onclick="resetAll()">🔄 پاک کردن فرم</button>
  </div>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   محاسبه پارامترهای شربت — نسخه ۳.۱
   کارخانه قند صنوبر — علی صنوبری
============================================================ */

/* ⭐ دکمه بازگشت هوشمند */
function goBack(){
  // ۱. اگر از داخل برنامه اومده (history داره)
  if(window.history.length > 1){
    try {
      history.back();
      // اگه بعد از ۱ ثانیه هنوز اینجاییم، fallback بزن
      setTimeout(function(){
        if(!document.hidden){
          tryFallbackNav();
        }
      }, 1000);
      return;
    } catch(e){}
  }
  // ۲. تلاش برای مسیر مستقیم
  tryFallbackNav();
}

function tryFallbackNav(){
  // تلاش برای مسیر نسبی
  var testUrl = './index.html';
  try {
    // چک می‌کنیم که آیا فایل وجود داره (فقط روی http/https کار می‌کنه)
    if(location.protocol === 'file:' || location.protocol === 'content:'){
      window.location.href = testUrl;
      // اگه بعد از ۱.۵ ثانیه هنوز اینجاییم، پیام بده
      setTimeout(function(){
        if(!document.hidden && document.body){
          var w = window.open(testUrl, '_self');
          if(!w){
            setTimeout(function(){
              alert('❌ فایل index.html رو پیدا نکردم.\n\nلطفاً مطمئن شوید هر دو فایل (index.html و syrup-calc.html) در یک پوشه هستن.\n\nاگه از فایل‌منیجر باز می‌کنید، به‌جاش از مرورگر یا سرور محلی استفاده کنید.');
            }, 800);
          }
        }
      }, 1500);
    } else {
      window.location.href = testUrl;
    }
  } catch(e){
    alert('❌ خطا در بازگشت: ' + e.message);
  }
}

/* جدول چگالی ساکارز (۲۰°C) — ۴۰ تا ۷۰ با گام ۰.۵ */
var DENSITY_TABLE = [
  [40.0,1.17679],[40.5,1.179604],[41.0,1.182418],[41.5,1.185232],
  [42.0,1.188046],[42.5,1.19086],[43.0,1.193674],[43.5,1.196488],
  [44.0,1.199302],[44.5,1.202116],[45.0,1.20493],[45.5,1.207765],
  [46.0,1.2106],[46.5,1.213435],[47.0,1.21627],[47.5,1.219105],
  [48.0,1.22194],[48.5,1.224775],[49.0,1.22761],[49.5,1.230445],
  [50.0,1.23328],[50.5,1.236115],[51.0,1.23895],[51.5,1.241785],
  [52.0,1.24462],[52.5,1.247455],[53.0,1.25029],[53.5,1.253125],
  [54.0,1.25596],[54.5,1.258795],[55.0,1.26163],[55.5,1.264477],
  [56.0,1.267324],[56.5,1.270171],[57.0,1.273018],[57.5,1.275865],
  [58.0,1.278712],[58.5,1.281559],[59.0,1.284406],[59.5,1.287253],
  [60.0,1.29010],[60.5,1.292953],[61.0,1.295806],[61.5,1.298659],
  [62.0,1.301512],[62.5,1.304365],[63.0,1.307218],[63.5,1.310071],
  [64.0,1.312924],[64.5,1.315777],[65.0,1.31863],[65.5,1.321492],
  [66.0,1.324354],[66.5,1.327216],[67.0,1.330078],[67.5,1.33294],
  [68.0,1.335802],[68.5,1.338664],[69.0,1.341526],[69.5,1.344388],
  [70.0,1.34725]
];

function getDensity(brix){
  if(isNaN(brix)) return 1.23328;
  if(brix <= 40) return DENSITY_TABLE[0][1];
  if(brix >= 70) return DENSITY_TABLE[DENSITY_TABLE.length - 1][1];
  for(var i = 0; i < DENSITY_TABLE.length - 1; i++){
    var a = DENSITY_TABLE[i], b = DENSITY_TABLE[i+1];
    if(brix >= a[0] && brix <= b[0]){
      var t = (brix - a[0]) / (b[0] - a[0]);
      return a[1] + t * (b[1] - a[1]);
    }
  }
  return 1.23328;
}

var FA = '۰۱۲۳۴۵۶۷۸۹';
function toFa(s){ return String(s).replace(/\d/g, function(d){ return FA[+d]; }); }
function toLatin(s){ return String(s).replace(/[۰-۹]/g, function(d){ return FA.indexOf(d); }).replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }); }
function num(id){ var v = document.getElementById(id).value.trim(); v = toLatin(v); return v === '' ? NaN : parseFloat(v); }
function fmt(v, dec){ if(isNaN(v) || !isFinite(v)) return '—'; if(dec == null) dec = 3; return toFa(v.toFixed(dec).replace(/\.?0+$/, '')); }

var darkMode = localStorage.getItem('lab_darkmode') === '1';
function applyDark(){ document.body.classList.toggle('dark', darkMode); document.getElementById('darkBtn').textContent = darkMode ? '☀️' : '🌙'; }
function toggleDark(){ darkMode = !darkMode; localStorage.setItem('lab_darkmode', darkMode ? '1' : '0'); applyDark(); }
applyDark();

function renderDensityTable(){
  var body = document.getElementById('densityBody');
  body.innerHTML = DENSITY_TABLE.map(function(row){
    return '<tr data-brix="' + row[0] + '"><td>' + toFa(row[0].toFixed(1)) + '</td><td>' + toFa(row[1].toFixed(5)) + '</td></tr>';
  }).join('');
  updateDensityHighlight();
}
function updateDensityHighlight(){
  var brix = num('inBrix');
  var rows = document.querySelectorAll('.density-table tbody tr');
  rows.forEach(function(r){ r.classList.remove('active'); });
  if(isNaN(brix)) return;
  var closest = null, minDiff = Infinity;
  rows.forEach(function(r){
    var rb = parseFloat(r.dataset.brix);
    var d = Math.abs(rb - brix);
    if(d < minDiff){ minDiff = d; closest = r; }
  });
  if(closest) closest.classList.add('active');
}
function toggleDensity(){
  var w = document.getElementById('densityWrap');
  var t = document.getElementById('densityToggle');
  var open = w.classList.toggle('open');
  t.classList.toggle('open', open);
  if(open){
    updateDensityHighlight();
    setTimeout(function(){
      var active = document.querySelector('.density-table tbody tr.active');
      if(active){
        var wrap = w;
        var top = active.offsetTop - wrap.clientHeight / 2 + active.offsetHeight / 2;
        wrap.scrollTop = Math.max(0, top);
      }
    }, 350);
  }
}
renderDensityTable();

function showToast(msg, type, dur){
  type = type || 'success'; dur = dur || 2800;
  var wrap = document.getElementById('toastWrap');
  var icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + msg + '</span>';
  wrap.appendChild(t);
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); }, 300); }, dur);
}

function showErr(msg){ document.getElementById('errMsg').innerHTML = msg; document.getElementById('errBox').classList.add('show'); }
function hideErr(){ document.getElementById('errBox').classList.remove('show'); }

var currentResults = null;

function validateAll(){
  hideErr();
  var errs = [];
  var brix = num('inBrix');
  var a1 = num('inA1');
  var a2 = num('inA2');
  var ec = num('inEC');
  var v = num('inV');
  var w = num('inW');

  if(isNaN(brix)) errs.push('بریکس را وارد کنید');
  else if(brix < 40 || brix > 70) errs.push('بریکس باید بین ۴۰ تا ۷۰ باشد');
  if(!isNaN(a1) && (a1 < 0.001 || a1 > 0.1)) errs.push('جذب بدون کدورت باید بین ۰.۰۰۱ تا ۰.۱ باشد');
  if(!isNaN(a2) && (a2 < 0.001 || a2 > 1)) errs.push('جذب با کدورت باید بین ۰.۰۰۱ تا ۱ باشد');
  if(!isNaN(a1) && !isNaN(a2) && a2 < a1) errs.push('جذب با کدورت باید ≥ جذب بدون کدورت باشد');
  if(!isNaN(ec) && ec <= 1) errs.push('هدایت الکتریکی باید بزرگ‌تر از ۱ باشد');
  if(!isNaN(v) && v < 0) errs.push('ید مصرفی نمی‌تواند منفی باشد');
  if(!isNaN(w) && w <= 0) errs.push('وزن ماده خشک باید مثبت باشد');

  if(errs.length){ showErr(errs.join(' • ')); return false; }
  return true;
}

function calculate(){
  if(!validateAll()){ showToast('لطفاً خطاها را برطرف کنید', 'warning'); return; }
  var brix = num('inBrix');
  var a1 = num('inA1');
  var a2 = num('inA2');
  var ec = num('inEC');
  var v = num('inV');
  var w = num('inW');

  if(isNaN(a1) && isNaN(ec) && isNaN(v)){
    showToast('حداقل یکی از پارامترها را وارد کنید', 'warning');
    return;
  }

  var rho = getDensity(brix);
  var K_ASH = 0.00060;
  var EC_WATER = 1;
  var N_IODINE = 1/300;
  var CONV_POAN = 0.0018;
  var CONV_COLOR = 7.5;

  var results = {
    brix: brix, rho: rho,
    color: null, turbidity: null,
    ashPercent: null, ashPoan: null,
    so2: null
  };

  // ۱. رنگ (پوآن)
  if(!isNaN(a1)){
    var raw = 1000 * a1 / ((brix / 100) * rho);
    results.color = raw / CONV_COLOR;
  }
  // ۲. کدورت (IU)
  if(!isNaN(a1) && !isNaN(a2) && a2 >= a1){
    results.turbidity = 1000 * (a2 - a1) / ((brix / 100) * rho);
  }
  // ۳. خاکستر (درصد)
  if(!isNaN(ec)){
    results.ashPercent = K_ASH * (ec - EC_WATER);
  }
  // ۴. خاکستر (پوآن)
  if(results.ashPercent !== null){
    results.ashPoan = results.ashPercent / CONV_POAN;
  }
  // ۵. SO₂ (ppm)
  if(!isNaN(v) && v >= 0 && !isNaN(w) && w > 0){
    results.so2 = v * N_IODINE * 32030 / w;
  }

  currentResults = results;
  renderResults();
  var hasAny = results.color !== null || results.turbidity !== null || results.ashPercent !== null || results.so2 !== null;
  document.getElementById('sendBtn').disabled = !hasAny;
  showToast('محاسبه انجام شد', 'success', 1800);
}

function renderResults(){
  var r = currentResults;
  if(!r) return;
  var items = [];

  if(r.color !== null) items.push(resItem('color', '🎨', 'رنگ محلول', fmt(r.color, 2), 'پوآن'));
  if(r.turbidity !== null) items.push(resItem('turbidity', '💧', 'کدورت', fmt(r.turbidity, 2), 'IU'));
  if(r.ashPercent !== null) items.push(resItem('ash', '🔥', 'خاکستر هدایت', fmt(r.ashPercent, 4), '٪'));
  if(r.ashPoan !== null) items.push(resItem('ashp', '🏭', 'خاکستر هدایت', fmt(r.ashPoan, 2), 'پوآن'));
  if(r.so2 !== null) items.push(resItem('so2', '💨', 'انیدرید سولفورو', fmt(r.so2, 2), 'ppm'));

  if(!items.length){
    document.getElementById('resultsArea').innerHTML = '<div class="empty-res"><span class="em-icon">⚠️</span>هیچ پارامتری محاسبه نشد</div>';
    return;
  }

  var cls = items.length > 1 ? 'results-grid two-col' : 'results-grid';
  var html = '<div class="' + cls + '">' + items.join('') + '</div>';

  html += '<div class="verify">';
  html += '<div class="v"><span class="k">بریکس</span><span class="val">' + toFa(r.brix.toFixed(2)) + ' %</span></div>';
  html += '<div class="v"><span class="k">چگالی</span><span class="val">' + toFa(r.rho.toFixed(5)) + '</span></div>';
  html += '<div class="v"><span class="k">Bx × ρ</span><span class="val">' + toFa(((r.brix/100) * r.rho).toFixed(5)) + '</span></div>';
  html += '<div class="v"><span class="k">ضریب پوآن</span><span class="val">0.0006</span></div>';
  html += '</div>';

  document.getElementById('resultsArea').innerHTML = html;
}

function resItem(cls, icon, label, value, unit){
  return '<div class="res res-' + cls + '">' +
    '<div class="r-ico">' + icon + '</div>' +
    '<div class="r-body">' +
      '<div class="r-lbl">' + label + '</div>' +
      '<div class="r-val">' + value + ' <span class="r-unit">' + unit + '</span></div>' +
    '</div></div>';
}

function sendToForm(){
  if(!currentResults){ showToast('ابتدا محاسبه کنید', 'warning'); return; }
  var r = currentResults;
  var prefill = { ts: Date.now() };
  if(r.color !== null) prefill.color = toLatin(r.color.toFixed(2).replace(/\.?0+$/, ''));
  if(r.turbidity !== null) prefill.turbidity = toLatin(r.turbidity.toFixed(2).replace(/\.?0+$/, ''));
  if(r.ashPoan !== null) prefill.ash = toLatin(r.ashPoan.toFixed(3).replace(/\.?0+$/, ''));
  if(r.so2 !== null) prefill.so2 = toLatin(r.so2.toFixed(2).replace(/\.?0+$/, ''));

  try {
    localStorage.setItem('lab_syrup_prefill', JSON.stringify(prefill));
    showToast('انتقال به فرم شربت...', 'success', 1500);
    setTimeout(function(){
      // مسیر نسبی برای index
      window.location.href = './index.html?prefill=syrup';
    }, 800);
  } catch(e){
    showToast('خطا در ذخیره', 'error');
  }
}

function resetAll(){
  document.getElementById('inBrix').value = '50';
  document.getElementById('inW').value = '50';
  ['inA1','inA2','inEC','inV'].forEach(function(id){ document.getElementById(id).value = ''; });
  currentResults = null;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('resultsArea').innerHTML = '<div class="empty-res"><span class="em-icon">🧪</span>مقادیر را وارد کرده و دکمه محاسبه را بزنید</div>';
  hideErr();
  updateDensityHighlight();
  showToast('فرم پاک شد', 'info', 1500);
}

window.addEventListener('DOMContentLoaded', function(){
  document.getElementById('inBrix').addEventListener('input', updateDensityHighlight);

  var order = ['inBrix','inEC','inA1','inA2','inV','inW'];
  order.forEach(function(id, idx){
    document.getElementById(id).addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        if(idx < order.length - 1) document.getElementById(order[idx+1]).focus();
        else calculate();
      }
    });
  });

  /* فوکوس روی بریکس + انتخاب متن */
  setTimeout(function(){
    var el = document.getElementById('inBrix');
    el.focus();
    el.select();
  }, 350);
});
